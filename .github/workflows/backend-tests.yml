name: NeuroSense Backend Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Run Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate firmware Python syntax
        run: |
          python -m py_compile firmware/esp32_firmware.py ml_model/train_face_stress_model.py backend/face_valence.py

      - name: Validate frontend JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path("frontend/index.html").read_text(encoding="utf-8")
          invite = Path("frontend/emergency-invite.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.DOTALL | re.IGNORECASE)
          invite_scripts = re.findall(r"<script\b[^>]*>(.*?)</script>", invite, flags=re.DOTALL | re.IGNORECASE)
          if len(scripts) != 1:
              raise SystemExit(f"Expected one inline application script, found {len(scripts)}")
          if len(invite_scripts) != 1:
              raise SystemExit(f"Expected one emergency invite script, found {len(invite_scripts)}")
          Path("/tmp/neurosense-frontend.js").write_text(scripts[0], encoding="utf-8")
          Path("/tmp/neurosense-invite.js").write_text(invite_scripts[0], encoding="utf-8")
          PY
          node --check /tmp/neurosense-frontend.js
          node --check /tmp/neurosense-invite.js

      - name: Run backend tests
        run: |
          python -m pytest backend/tests/test_main.py backend/tests/test_face_stress_training.py backend/tests/test_recovery_features.py backend/tests/test_face_valence.py -v

  openface-docker-smoke:
    name: Build OpenFace image and run sample extraction
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runtime image
        run: |
          docker buildx build --load --tag neurosense-openface:ci .

      - name: Verify OpenFace executable and linked libraries
        run: |
          docker run --rm --entrypoint /bin/bash neurosense-openface:ci -lc '
            set -euo pipefail
            test -x "$OPENFACE_FEATURE_EXTRACTION_PATH"
            missing="$(ldd "$OPENFACE_FEATURE_EXTRACTION_PATH" | grep "not found" || true)"
            if [ -n "$missing" ]; then
              printf "%s\n" "$missing"
              exit 1
            fi
            test -f "$OPENFACE_ROOT/build/bin/model/main_clm_general.txt"
            test -s "$OPENFACE_ROOT/build/bin/model/patch_experts/cen_patches_0.25_of.dat"
            test -f /app/ml_model/neurosense_stress_model.joblib
          '

      - name: Run OpenFace on its bundled sample video
        run: |
          docker run --rm --entrypoint /bin/bash neurosense-openface:ci -lc '
            set -euo pipefail
            mkdir -p /tmp/openface-smoke
            cd "$(dirname "$OPENFACE_FEATURE_EXTRACTION_PATH")"
            ./FeatureExtraction \
              -f "$OPENFACE_ROOT/samples/2015-10-15-15-14.avi" \
              -aus -gaze -pose \
              -out_dir /tmp/openface-smoke \
              -q
            csv="$(find /tmp/openface-smoke -maxdepth 1 -type f -name "*.csv" -size +0c -print -quit)"
            test -n "$csv"
            python - "$csv" <<\x27PY\x27
            import csv, sys
            with open(sys.argv[1], newline="", encoding="utf-8-sig") as handle:
                fields = next(csv.reader(handle))
            required = {"timestamp", "success", "confidence", "gaze_angle_x", "pose_Tx", "AU01_r"}
            missing = sorted(required.difference(fields))
            if missing:
                raise SystemExit(f"OpenFace CSV missing expected fields: {missing}")
            PY
          '
