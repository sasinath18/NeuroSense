name: NeuroSense Backend Tests

on:
  # The feature branch is validated by its pull request; running both push
  # and pull_request for every commit caused duplicate multi-minute Docker builds.
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Keep only one active CI run per branch/PR; a newer commit supersedes stale runs.
concurrency:
  group: neurosense-ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-openface-changes:
    name: Detect OpenFace image changes
    runs-on: ubuntu-latest
    outputs:
      openface: ${{ steps.filter.outputs.openface }}
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check whether OpenFace image inputs changed
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          run_openface=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            run_openface=true
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
            if printf '%s\n' "$changed_files" | grep -Eq '^(Dockerfile|\.dockerignore|requirements-render\.txt|requirements-affec-worker\.txt|backend/face_valence\.py|backend/face_valence_worker\.py|backend/face_arousal\.py|ml_model/face_valence/|ml_model/face_arousal/|ml_model/neurosense_stress_model\.joblib)'; then
              run_openface=true
            fi
          elif [[ "$EVENT_NAME" == "push" && ( "$REF_NAME" == "feature/affec-face-valence" || "$REF_NAME" == "fix/affec-openface-smoke" ) ]]; then
            run_openface=true
          fi
          echo "openface=$run_openface" >> "$GITHUB_OUTPUT"
          echo "Run OpenFace Docker smoke: $run_openface"

  backend-tests:
    name: Run Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.12.0"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate firmware Python syntax
        run: |
          python -m py_compile firmware/esp32_firmware.py ml_model/train_face_stress_model.py backend/face_valence.py backend/face_arousal.py

      - name: Validate frontend JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path("frontend/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.DOTALL | re.IGNORECASE)
          if len(scripts) != 1:
              raise SystemExit(f"Expected one inline application script, found {len(scripts)}")
          Path("/tmp/neurosense-frontend.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/neurosense-frontend.js

      - name: Test browser-local FaceScan feature windows
        run: node --test frontend/tests/face-stress-features.test.mjs

      - name: Run backend tests
        run: |
          python -m pytest backend/tests/test_main.py backend/tests/test_face_stress_training.py backend/tests/test_recovery_features.py backend/tests/test_face_valence.py backend/tests/test_face_arousal.py backend/tests/test_frontend_face_scan.py backend/tests/test_firmware_configuration.py -v

  openface-docker-smoke:
    name: Build OpenFace image and run sample extraction
    needs: detect-openface-changes
    if: needs.detect-openface-changes.outputs.openface == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runtime image (persistent GitHub Actions cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          progress: plain
          tags: neurosense-openface:ci
          cache-from: type=gha,scope=neurosense-openface
          cache-to: type=gha,scope=neurosense-openface,mode=max

      - name: Verify wearable model under its serialized scikit-learn version
        run: |
          docker run --rm --entrypoint python neurosense-openface:ci -c '
          import joblib
          import numpy as np
          import sklearn
          from pathlib import Path
          assert sklearn.__version__ == "1.9.1", sklearn.__version__
          model = joblib.load("/app/ml_model/neurosense_stress_model.joblib")
          if not hasattr(model, "predict"):
              raise SystemExit("Wearable stress artifact is not a directly usable estimator.")
          feature_count = int(getattr(model, "n_features_in_", 8))
          model.predict(np.zeros((1, feature_count), dtype=np.float32))
          print("Wearable model load/predict OK:", type(model).__name__, "scikit-learn:", sklearn.__version__)
          '

      - name: Verify isolated AFFEC worker runtime
        run: |
          docker run --rm --entrypoint /opt/affec-venv/bin/python neurosense-openface:ci -c '
          import joblib
          import numpy
          import pandas
          import sklearn
          assert sklearn.__version__ == "1.6.1", sklearn.__version__
          assert numpy.__version__ == "2.4.6", numpy.__version__
          assert pandas.__version__ == "2.2.3", pandas.__version__
          assert joblib.__version__ == "1.6.0", joblib.__version__
          compile(open("/app/backend/face_valence_worker.py", encoding="utf-8").read(), "face_valence_worker.py", "exec")
          print("AFFEC worker runtime OK:", sklearn.__version__, numpy.__version__, pandas.__version__, joblib.__version__)
          '

      - name: Verify OpenFace executable, dependencies and model assets
        run: |
          docker run --rm --entrypoint /bin/bash neurosense-openface:ci -lc '
            set -euo pipefail
            test -x "$OPENFACE_FEATURE_EXTRACTION_PATH"
            missing="$(ldd "$OPENFACE_FEATURE_EXTRACTION_PATH" | grep "not found" || true)"
            if [ -n "$missing" ]; then
              printf "%s\n" "$missing"
              exit 1
            fi
            model_dir="$OPENFACE_ROOT/build/bin/model/patch_experts"
            cd "$model_dir"
            echo "OpenFace patch-expert asset sizes and SHA-256:"
            stat -c "%n %s bytes" cen_patches_*.dat
            sha256sum cen_patches_*.dat
            echo "99d3df9888115428075de7b8f1bc86176881de640c2fdf47e2ab0cee556661bf  cen_patches_0.25_of.dat" | sha256sum -c -
            echo "1070bff51b077ee6a18ce8e1ebbc6f568e1a7a469f6911a8263413878b3df469  cen_patches_0.35_of.dat" | sha256sum -c -
            echo "3f08124067e326e83e3261a55c79493e745b01138c9c1b59713dd9b17424168e  cen_patches_0.50_of.dat" | sha256sum -c -
            echo "bed961bbfa2cc41a709d44c1d1d8a92b2537bc46f2fd6ab430c137fedd0e21b0  cen_patches_1.00_of.dat" | sha256sum -c -
            test -f "$OPENFACE_ROOT/build/bin/model/main_clm_general.txt"
            test -f /app/ml_model/neurosense_stress_model.joblib
          '

      - name: Run OpenFace extraction on a short fixture with diagnostics
        run: |
          docker run --rm --entrypoint /bin/bash neurosense-openface:ci -lc '
            set -euo pipefail
            ulimit -c 0
            mkdir -p /tmp/openface-smoke
            cd "$(dirname "$OPENFACE_FEATURE_EXTRACTION_PATH")"

            export OMP_NUM_THREADS=1
            export OPENBLAS_NUM_THREADS=1
            export MKL_NUM_THREADS=1
            export OPENCV_FOR_THREADS_NUM=1

            ffmpeg -y -v error -i "$OPENFACE_ROOT/samples/2015-10-15-15-14.avi" -t 5 -vf "scale=640:-2,fps=15" -an -c:v mjpeg -q:v 5 /tmp/openface-smoke/fixture.avi

            echo "Container memory:"
            free -h
            ./FeatureExtraction -f /tmp/openface-smoke/fixture.avi -aus -gaze -pose -out_dir /tmp/openface-smoke -q

            csv="$(find /tmp/openface-smoke -maxdepth 1 -type f -name "fixture.csv" -size +0c -print -quit)"
            test -n "$csv"
            header="$(head -n 1 "$csv")"
            for field in timestamp success confidence gaze_angle_x pose_Tx AU01_r; do
              case ",$header," in
                *,"$field",*) ;;
                *) echo "OpenFace CSV is missing required field: $field"; exit 1 ;;
              esac
            done
          '

  firebase-rules-emulator:
    name: Test Firebase Security Rules in Emulator Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.12.0"

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Firebase rules test dependencies
        run: npm install --prefix tests/firebase-rules --no-audit --no-fund --engine-strict

      - name: Test Firestore and Storage client rules in demo project
        run: |
          npx --yes firebase-tools@15.36.0 emulators:exec \
            --only firestore,storage \
            --project demo-neurosense-rules \
            "npm --prefix tests/firebase-rules test"
