name: NeuroSense Secret Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: neurosense-secret-scan-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Scan all Git history for exposed secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check out full Git history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version="8.30.1"
          archive="/tmp/gitleaks_${version}_linux_x64.tar.gz"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            --output "${archive}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${archive}" | sha256sum --check -
          mkdir -p /tmp/gitleaks
          tar -xzf "${archive}" -C /tmp/gitleaks gitleaks
          /tmp/gitleaks/gitleaks version

      - name: Scan all reachable commit history (redacted output)
        shell: bash
        run: |
          set -euo pipefail
          /tmp/gitleaks/gitleaks git \
            --redact \
            --report-format sarif \
            --report-path /tmp/gitleaks.sarif \
            .
