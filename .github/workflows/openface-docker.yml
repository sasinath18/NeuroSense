name: NeuroSense OpenFace Docker Smoke Test

on:
  push:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "requirements-render.txt"
      - "backend/face_valence.py"
      - ".github/workflows/openface-docker.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "requirements-render.txt"
      - "backend/face_valence.py"
      - ".github/workflows/openface-docker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    name: Build OpenFace image and run sample extraction
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runtime image
        run: |
          docker buildx build --load --tag neurosense-openface:ci .

      - name: Verify OpenFace executable and linked libraries
        run: |
          docker run --rm --entrypoint /bin/bash neurosense-openface:ci -lc '
            set -euo pipefail
            test -x "$OPENFACE_FEATURE_EXTRACTION_PATH"
            missing="$(ldd "$OPENFACE_FEATURE_EXTRACTION_PATH" | grep "not found" || true)"
            if [ -n "$missing" ]; then
              printf "%s\n" "$missing"
              exit 1
            fi
            test -f "$OPENFACE_ROOT/model/main_clm_general.txt"
          '

      - name: Run OpenFace on its bundled sample video
        run: |
          docker run --rm --entrypoint /bin/bash neurosense-openface:ci -lc '
            set -euo pipefail
            mkdir -p /tmp/openface-smoke
            cd "$OPENFACE_ROOT"
            "$OPENFACE_FEATURE_EXTRACTION_PATH" \
              -f samples/2015-10-15-15-14.avi \
              -aus -gaze -pose \
              -out_dir /tmp/openface-smoke \
              -q
            test -n "$(find /tmp/openface-smoke -maxdepth 1 -type f -name "*.csv" -size +0c -print -quit)"
          '
