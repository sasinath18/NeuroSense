name: Deploy Firebase Security Rules

on:
  workflow_dispatch:

# Rules are production security policy. Deploy only when explicitly launched.
concurrency:
  group: neurosense-firebase-rules-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-rules:
    name: Publish Firestore and Storage rules
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Validate dedicated Firebase rules deploy credential
        env:
          FIREBASE_DEPLOY_CREDENTIALS: ${{ secrets.NEUROSENSE_FIREBASE_RULES_DEPLOY_CREDENTIALS_JSON }}
        run: |
          node <<'NODE'
          const raw = process.env.FIREBASE_DEPLOY_CREDENTIALS;
          if (!raw) {
            throw new Error(
              "Missing GitHub Actions secret NEUROSENSE_FIREBASE_RULES_DEPLOY_CREDENTIALS_JSON."
            );
          }

          let credential;
          try {
            credential = JSON.parse(raw);
          } catch {
            throw new Error("Firebase rules deploy credential is not valid JSON.");
          }

          if (credential.type !== "service_account") {
            throw new Error("Firebase rules deploy credential must be a service-account JSON.");
          }

          if (credential.project_id !== "neurosense-d7f69") {
            throw new Error(
              "Firebase rules deploy credential project_id does not match neurosense-d7f69."
            );
          }

          if (!credential.client_email || !credential.private_key) {
            throw new Error("Firebase rules deploy service-account JSON is incomplete.");
          }

          console.log("Dedicated rules deploy credential is valid for the target project.");
          NODE

      - name: Authenticate to Google Cloud
        id: google-auth
        uses: google-github-actions/auth@v3
        with:
          project_id: neurosense-d7f69
          credentials_json: ${{ secrets.NEUROSENSE_FIREBASE_RULES_DEPLOY_CREDENTIALS_JSON }}
          token_format: access_token

      - name: Verify required Google APIs are enabled
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
        run: |
          set -euo pipefail
          echo "::add-mask::$GOOGLE_ACCESS_TOKEN"

          for api in firebaserules.googleapis.com firestore.googleapis.com firebasestorage.googleapis.com; do
            response_file="$(mktemp)"
            status="$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}" \
              --header "Authorization: Bearer $GOOGLE_ACCESS_TOKEN" \
              "https://serviceusage.googleapis.com/v1/projects/neurosense-d7f69/services/$api")"

            if [ "$status" = "403" ]; then
              echo "::error::$api status cannot be read. Grant the deploy service account Service Usage Viewer (roles/serviceusage.serviceUsageViewer)."
              cat "$response_file"
              rm -f "$response_file"
              exit 1
            fi

            if [ "$status" != "200" ]; then
              echo "::error::Could not check $api (HTTP $status)."
              cat "$response_file"
              rm -f "$response_file"
              exit 1
            fi

            state="$(node -e 'const fs=require("fs"); process.stdout.write(JSON.parse(fs.readFileSync(process.argv[1],"utf8")).state || "UNKNOWN")' "$response_file")"
            rm -f "$response_file"

            if [ "$state" != "ENABLED" ]; then
              echo "::error::$api is $state. A project owner must enable this API before the workflow can deploy rules."
              exit 1
            fi

            echo "$api is enabled."
          done

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy only Firestore and Storage security rules
        run: |
          firebase deploy \
            --project neurosense-d7f69 \
            --only firestore:rules,storage \
            --non-interactive
