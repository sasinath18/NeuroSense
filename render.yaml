services:
  - type: web
    name: neurosense-app
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -r requirements-render.txt
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.14
      - key: NEUROSENSE_ENV
        value: production
      - key: NEUROSENSE_DB_PATH
        value: /tmp/neurosense.db
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: FIREBASE_WEB_API_KEY
        sync: false
      - key: FIREBASE_WEB_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_WEB_PROJECT_ID
        sync: false
      - key: FIREBASE_WEB_APP_ID
        sync: false
      - key: FIREBASE_WEB_MESSAGING_SENDER_ID
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: NEUROSENSE_MUSIC_DIR
        value: /tmp/neurosense-music
      - key: GOOGLE_DRIVE_API_KEY
        sync: false
      - key: GOOGLE_DRIVE_APP_ID
        sync: false
