services:
  - type: web
    name: neurosense-app
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NEUROSENSE_ENV
        value: production
      - key: NEUROSENSE_DB_PATH
        value: /tmp/neurosense.db
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: FIREBASE_WEB_API_KEY
        sync: false
      - key: FIREBASE_WEB_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_WEB_PROJECT_ID
        sync: false
      - key: FIREBASE_WEB_APP_ID
        sync: false
      - key: FIREBASE_WEB_MESSAGING_SENDER_ID
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: NEUROSENSE_MUSIC_DIR
        value: /tmp/neurosense-music
      - key: GOOGLE_DRIVE_API_KEY
        sync: false
      - key: GOOGLE_DRIVE_APP_ID
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        value: NeuroSense_Wellness_Alert_Bot
      - key: NEUROSENSE_FACE_VALENCE_MODEL_URL
        sync: false
      - key: NEUROSENSE_FACE_VALENCE_MODEL_SHA256
        sync: false
      - key: NEUROSENSE_FACE_AROUSAL_MODEL_URL
        sync: false
      - key: NEUROSENSE_FACE_AROUSAL_MODEL_SHA256
        sync: false
      - key: NEUROSENSE_FACE_AROUSAL_MODEL_PATH
        value: /app/ml_model/face_arousal/neurosense_face_arousal_gb_v2.joblib
      - key: NEUROSENSE_FACE_VALENCE_MODEL_PATH
        value: /app/ml_model/face_valence/neurosense_face_valence_rf.joblib
      - key: NEUROSENSE_FACE_VALENCE_WEBCAM_EXPERIMENT_ENABLED
        value: "false"
      - key: NEUROSENSE_FACE_VALENCE_FEATURE_PARITY_VERIFIED
        value: "false"
      - key: NEUROSENSE_FACE_VALENCE_NEW_USER_VALIDATION_VERIFIED
        value: "false"
      - key: OPENFACE_ROOT
        value: /opt/OpenFace
      - key: OPENFACE_FEATURE_EXTRACTION_PATH
        value: /opt/OpenFace/build/bin/FeatureExtraction
